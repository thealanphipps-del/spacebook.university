apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spacebook-stratum-netpol
  namespace: apex-cortex
spec:
  podSelector:
    matchLabels:
      app: spacebook-stratum-pool
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 3335
      protocol: TCP
    - port: 3337
      protocol: TCP
  egress:
  - ports:
    - port: 6379
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: valkey
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
